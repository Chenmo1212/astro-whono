name: weibo-sync

on:
  schedule:
    # 每天 UTC 15:30 = 北京时间 23:30
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      fetch_mode:
        description: "爬取模式（count=最新N条 / since_date=从指定日期起）"
        required: false
        default: "count"
        type: choice
        options:
          - count
          - since_date
      fetch_count:
        description: "fetch_mode=count 时：抓取条数"
        required: false
        default: "3"
      fetch_since_date:
        description: "fetch_mode=since_date 时：起始日期（YYYY-MM-DD）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  sync:
    name: Fetch Weibo & Sync to Blog
    runs-on: ubuntu-latest
    environment: Blog

    steps:
      # ── 1. checkout 整个博客仓库 ─────────────────
      - name: Checkout repo
        uses: actions/checkout@v4

      # ── 2. 安装 Python 依赖 ───────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/weibo-diary-crawler/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/weibo-diary-crawler/requirements.txt

      # ── 3. 执行爬虫完整管道 ───────────────────────────────────────────────
      - name: Run crawler pipeline
        working-directory: scripts/weibo-diary-crawler
        env:
          WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          QINIU_BUCKET: ${{ vars.QINIU_BUCKET }}
          QINIU_DOMAIN: ${{ vars.QINIU_DOMAIN }}
        run: python main.py --run-now

      # ── 4. commit 新 bits 文件并 push，触发博客 ci.yml 完成部署 ───────────
      - name: Commit & push new bits files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/bits/
          if git diff --cached --quiet; then
            echo "✓ No new bits files today, skipping commit."
          else
            git commit -m "chore(bits): auto-sync weibo $(date -u +'%Y-%m-%d')"
            git push
          fi
