weibo:
  # Cookie 通过环境变量 WEIBO_COOKIE 提供，请勿写入此文件
  cookie: ""
  # 你自己的微博数字 UID（在个人主页 URL 中可以找到，如 https://weibo.com/u/7796507396）
  uid: "7796507396"

  # 爬取模式，二选一：
  #   count       —— 只爬最新 fetch_count 条（默认日常定时使用）
  #   since_date  —— 从 fetch_since_date 起一直爬到当前（历史回溯）
  fetch_mode: "count"

  # fetch_mode=count 时有效：抓取最新几条原创微博
  fetch_count: 3

  # fetch_mode=since_date 时有效：爬取该日期（含）之后的所有原创微博
  # 格式 YYYY-MM-DD，如 2026-01-01
  fetch_since_date: "2026-01-01"

  # 每页请求的微博数量（对应原项目 page_weibo_count）
  page_weibo_count: 10

# storage.mode 控制持久化方式：
#   json    —— 保存到本地 JSON 文件（无需 MongoDB，适合本地调试）
#   mongodb —— 写入 MongoDB（需要本地或远端 MongoDB 服务）
storage:
  mode: "json"              # 可选值：json / mongodb
  json_path: "./data/posts.json"  # mode=json 时的保存文件路径

mongodb:
  # MongoDB 连接字符串（也可通过环境变量 MONGO_URI 覆盖）
  uri: "mongodb://localhost:27017"
  database: "weibo_diary"
  collection: "posts"

scheduler:
  # 每天定时执行时间，格式 HH:MM（24小时制）
  run_time: "23:30"

images:
  # 图片保存根目录，子目录结构为 {save_dir}/{YYYY}/{YYYYMMDD}_01.jpg
  save_dir: "./images"
  # 下载超时秒数
  timeout: 30
  # 单张图片下载最大重试次数
  max_retries: 3

# 隐私检查配置（使用 DeepSeek API）
# API 密钥通过环境变量 DEEPSEEK_API_KEY 提供，请勿写入此文件
privacy:
  # 是否启用隐私检查
  enabled: true
  # 使用的模型（默认 deepseek-chat，更强但更慢可用 deepseek-reasoner）
  model: "deepseek-chat"
  # 若为 true，对标记为敏感的文件写入 encrypted: true；false 则仅打印（dry-run）
  apply: true
  # 每次 API 调用的超时秒数
  timeout: 60

# 完整处理管道配置
pipeline:
  # 是否启用完整处理管道（爬取 → 压缩 → 上传 → bits转换）
  enabled: true
  
  # 图片压缩配置
  image_quality: 75              # JPEG/WebP 质量（1-100，默认 75）
  image_dry_run: false           # 仅压缩不上传（调试用）
  
  # bits markdown 生成配置
  bits_enabled: true             # 是否生成 bits markdown 文件
  bits_write: true               # 是否实际写入文件（false 则仅干运行）
  cdn_prefix: "blog"             # CDN 对象键前缀
  cdn_domain: ""                 # CDN 域名（如 https://cdn.chenmo1212.cn），留空则使用相对路径
